<!doctype html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7A2430">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>பாடசாலைக் கல்விப் பண்புத்தர மதிப்பீடு</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F2E7;
    --paper-2:#FFFDF8;
    --ink:#2B2419;
    --ink-soft:#5B5344;
    --maroon:#7A2430;
    --maroon-deep:#5C1B24;
    --gold:#A9812F;
    --gold-light:#D9C489;
    --line:#DDD1AF;
    --sage:#3F6B4A;
    --olive:#8A8F3F;
    --amber:#B98A1E;
    --rust-lite:#C97A3B;
    --rust:#A6432E;
    --radius:5px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Tamil','Noto Sans',sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.serif{ font-family:'Noto Serif Tamil','Noto Sans Tamil',serif; }
  #app{ max-width:1000px; margin:0 auto; padding:0 18px 60px; }
  a{ color:inherit; }

  /* --- topbar --- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:16px 0; border-bottom:2px solid var(--maroon);
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-title{ font-family:'Noto Serif Tamil',serif; font-weight:700; font-size:1.15rem; color:var(--maroon-deep); }
  .brand-sub{ font-size:.8rem; color:var(--ink-soft); }
  .topbar-actions{ display:flex; align-items:center; gap:12px; }
  .save-status{ font-size:.78rem; color:var(--ink-soft); white-space:nowrap; }

  .emblem{ width:42px; height:42px; flex:0 0 auto; }

  /* --- buttons / fields --- */
  .btn-primary, .btn-outline, .btn-ghost, .btn-icon, .btn-tiny{
    font-family:inherit; cursor:pointer; border-radius:var(--radius); border:1px solid var(--maroon);
    font-size:.92rem; transition:background .15s, color .15s, opacity .15s;
  }
  .btn-primary{ background:var(--maroon); color:var(--paper-2); padding:12px 22px; font-weight:600; }
  .btn-primary:hover{ background:var(--maroon-deep); }
  .btn-outline{ background:transparent; color:var(--maroon-deep); padding:9px 16px; }
  .btn-outline:hover{ background:var(--maroon); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); padding:7px 14px; }
  .btn-ghost:hover{ border-color:var(--maroon); color:var(--maroon-deep); }
  .btn-icon{ background:transparent; border-color:var(--line); color:var(--ink-soft); width:30px; height:30px; padding:0; line-height:1; flex:0 0 auto; }
  .btn-icon.danger:hover{ background:var(--rust); border-color:var(--rust); color:#fff; }
  .btn-tiny{ background:transparent; border-color:var(--line); color:var(--ink-soft); padding:4px 10px; font-size:.78rem; }
  .btn-tiny:hover{ border-color:var(--rust); color:var(--rust); }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .field.small{ max-width:140px; }
  .field label{ font-size:.8rem; color:var(--ink-soft); }
  input[type=text], input[type=password], select, textarea{
    font-family:inherit; font-size:.95rem; padding:9px 10px; border:1px solid var(--line);
    border-radius:var(--radius); background:var(--paper-2); color:var(--ink); width:100%;
  }
  input[type=text]:focus, input[type=password]:focus, select:focus, textarea:focus{
    outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);
  }
  textarea{ min-height:56px; resize:vertical; }

  /* --- landing / login --- */
  .center-wrap{ min-height:70vh; display:flex; align-items:center; justify-content:center; padding:30px 0; }
  .login-card{
    background:var(--paper-2); border:1px solid var(--line); border-radius:8px;
    padding:32px 30px; max-width:420px; width:100%; text-align:center;
  }
  .login-card h1{ margin:14px 0 4px; font-size:1.3rem; color:var(--maroon-deep); }
  .login-card p{ color:var(--ink-soft); font-size:.9rem; margin:0 0 22px; }
  .choice-btns{ display:flex; flex-direction:column; gap:12px; }
  .choice-btns button{ padding:14px; font-size:1rem; }
  .error-msg{ color:var(--rust); font-size:.85rem; margin-top:8px; min-height:1.2em; }
  .note-small{ font-size:.78rem; color:var(--ink-soft); margin-top:18px; border-top:1px dashed var(--line); padding-top:12px; text-align:left; }
  .back-link{ margin-top:16px; display:inline-block; font-size:.85rem; color:var(--ink-soft); text-decoration:underline; cursor:pointer; background:none; border:none; }

  /* --- dept header --- */
  .dept-header{ padding:22px 0 10px; }
  .dept-header h1{ margin:0 0 2px; font-size:1.5rem; color:var(--maroon-deep); }
  .dept-sub{ color:var(--ink-soft); margin:0 0 16px; font-size:.9rem; }
  .stat-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .stat-box{
    background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 18px; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:110px;
  }
  .stat-num{ font-family:'Noto Serif Tamil',serif; font-weight:700; font-size:1.4rem; color:var(--maroon-deep); }
  .stat-num.big{ font-size:2.1rem; }
  .stat-label{ font-size:.75rem; color:var(--ink-soft); }

  .badge{ display:inline-block; padding:5px 12px; border-radius:20px; font-size:.8rem; font-weight:600; background:#ccc; color:#222; }
  .badge.small{ font-size:.72rem; padding:3px 9px; }
  .grade-6{ background:var(--sage); color:#fff; }
  .grade-5{ background:#5C8A52; color:#fff; }
  .grade-4{ background:var(--olive); color:#fff; }
  .grade-3{ background:var(--amber); color:#2B2419; }
  .grade-2{ background:var(--rust-lite); color:#fff; }
  .grade-1{ background:var(--rust); color:#fff; }

  /* --- criteria / indicators --- */
  .criteria-list{ margin-top:18px; display:flex; flex-direction:column; gap:16px; }
  .criterion{ background:var(--paper-2); border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
  .criterion-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .crit-num{ font-size:.78rem; color:var(--gold); font-weight:700; white-space:nowrap; }
  .crit-title{ flex:1; font-weight:600; border:1px solid transparent; background:transparent; padding:6px 8px; }
  .crit-title:hover{ border-color:var(--line); }
  .ind-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
  .ind-row{
    display:flex; gap:10px; align-items:flex-start; border-top:1px dashed var(--line); padding-top:10px;
  }
  .ind-row:first-child{ border-top:none; padding-top:0; }
  .ind-num{ font-size:.78rem; color:var(--ink-soft); padding-top:10px; width:20px; flex:0 0 auto; }
  .ind-main{ flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .ind-title{ font-weight:500; }
  .ind-controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .ind-score{ max-width:280px; }
  .file-btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:var(--radius);
    padding:8px 12px; font-size:.85rem; cursor:pointer; color:var(--ink-soft);
  }
  .file-btn:hover{ border-color:var(--gold); color:var(--maroon-deep); }
  .ind-thumb-wrap{ display:flex; align-items:center; gap:10px; }

  .entries-list{ display:flex; flex-direction:column; gap:10px; margin:4px 0 10px; }
  .entry-row{ border:1px solid var(--line); border-radius:5px; padding:10px; background:var(--paper); display:flex; flex-direction:column; gap:8px; }
  .entry-top{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .ind-thumb{ max-width:120px; max-height:90px; border-radius:4px; border:1px solid var(--line); object-fit:cover; }

  /* --- reflection box --- */
  .reflect-box{ margin-top:20px; padding:14px 16px; background:var(--paper-2); border:1px dashed var(--line); border-radius:6px; }
  .reflect-box label{ display:block; font-size:.85rem; color:var(--ink-soft); margin-bottom:6px; }

  /* --- admin overview --- */
  .admin-header{ display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; padding:20px 0; }
  .school-fields{ display:flex; gap:14px; flex:1; min-width:220px; flex-wrap:wrap; }
  .overall-box{
    background:var(--paper-2); border:1px solid var(--gold); border-radius:8px; padding:16px 24px;
    display:flex; flex-direction:column; align-items:center; gap:6px; min-width:220px;
  }
  .hint{ font-size:.75rem; color:var(--ink-soft); }
  .dept-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:6px; }
  .dept-card{
    text-align:left; background:var(--paper-2); border:1px solid var(--line); border-radius:6px;
    padding:14px 16px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:8px;
  }
  .dept-card:hover{ border-color:var(--gold); }
  .dept-card-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .dept-card-name{ font-weight:600; font-size:.92rem; }
  .bar{ height:8px; background:#EEE3C6; border-radius:5px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--gold); }
  .dept-card-foot{ display:flex; justify-content:space-between; font-size:.78rem; color:var(--ink-soft); }

  .admin-tools{ display:flex; gap:10px; flex-wrap:wrap; margin:22px 0 10px; }
  .pins-panel{ background:var(--paper-2); border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:20px; }
  .pins-panel.hidden{ display:none; }
  .pins-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .import-warning{ font-size:.78rem; color:var(--rust); }

  footer.app-footer{ text-align:center; font-size:.75rem; color:var(--ink-soft); padding:30px 0 10px; }

  @media (max-width:640px){
    .ind-row{ flex-wrap:wrap; }
    .ind-num{ display:none; }
    .stat-row{ gap:8px; }
    .admin-header{ flex-direction:column; }
  }

  @media print{
    .topbar-actions, .admin-tools, .pins-panel, .btn-icon, .file-btn, .ind-controls .file-btn, .btn-tiny, .no-print{ display:none !important; }
    body{ background:#fff; }
    .dept-card{ break-inside:avoid; }
  }

  .setup-table{ width:100%; border-collapse:collapse; margin-top:10px; }
  .setup-table th, .setup-table td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:.88rem; }
  .setup-table th{ color:var(--ink-soft); font-weight:600; }
  .role-select{ padding:5px 8px; }
  .add-user-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; background:var(--paper-2); border:1px dashed var(--line); border-radius:6px; padding:14px; margin-bottom:16px; }
  .add-user-form .field{ margin-bottom:0; min-width:160px; }
  .link-btn{ background:none; border:none; color:var(--maroon-deep); text-decoration:underline; cursor:pointer; font-size:.85rem; padding:0; font-family:inherit; }
  .setup-notice{ background:#FBEFD0; border:1px solid var(--gold); border-radius:6px; padding:14px 16px; margin:16px 0; font-size:.88rem; }
  .setup-notice code{ background:#fff; padding:1px 5px; border-radius:3px; border:1px solid var(--line); }
  .pill{ display:inline-block; padding:2px 9px; border-radius:12px; font-size:.72rem; background:var(--gold-light); color:var(--maroon-deep); font-weight:600; }
  .center-wrap .login-card input{ margin-bottom:2px; }

  /* ---- evidence / criteria report (printable) ---- */
  .report-crit-block{ margin-bottom:26px; page-break-inside:avoid; }
  .report-crit-title{ font-family:'Noto Serif Tamil',serif; font-weight:700; color:var(--maroon-deep); font-size:1.05rem; border-bottom:2px solid var(--gold); padding-bottom:6px; margin-bottom:12px; }
  .report-ind{ display:flex; flex-direction:column; align-items:stretch; gap:8px; border-top:1px dashed var(--line); padding:14px 0; page-break-inside:avoid; margin-bottom:6px; }
  .report-ind:first-child{ border-top:none; }
  .report-entry{ display:flex; gap:14px; align-items:flex-start; padding:8px 0 8px 10px; border-left:2px solid var(--gold-light); page-break-inside:avoid; }
  .report-img, .report-img-empty{ width:150px; height:110px; flex:0 0 auto; border-radius:5px; border:1px solid var(--line); }
  .report-img{ object-fit:cover; }
  .report-img-empty{ display:flex; align-items:center; justify-content:center; background:#F2ECDD; color:var(--ink-soft); font-size:.75rem; text-align:center; padding:6px; }
  .report-ind-body{ flex:1; min-width:0; }
  .report-ind-title{ font-weight:600; margin-bottom:4px; }
  .report-ind-note{ font-size:.88rem; color:var(--ink-soft); white-space:pre-wrap; }
  .report-print-header{ display:none; }
  @media print{
    .report-print-header{ display:block; text-align:center; margin-bottom:20px; }
    .report-crit-block{ break-inside:avoid; }
    .report-ind{ break-inside:avoid; }
    .report-entry{ break-inside:avoid; }
  }
</style>

<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
var REAL_SEED = {
  d1: [
    ['கலைத்திட்ட நோக்கத்தை அண்மித்தல் (ஆரம்பக் கல்வி)', [
      'முதன்மைநிலை 1க்குரிய தேர்ச்சிகள் 40 உம் அடைந்த மாணவர் %',
      'முதன்மைநிலை 2க்குரிய தேர்ச்சிகள் 52 உம் அடைந்த மாணவர் %',
      'முதன்மைநிலை 3க்குரிய தேர்ச்சிகள் 55 உம் அடைந்த மாணவர் %'
    ]],
    ['தேசிய மட்டத்திலான பரீட்சைகளில் உயர் பெறுபேறுகளைப் பெற்றுக்கொள்ளல்', [
      'தரம் 5 புலமைப்பரிசில் பரீட்சையில் 70 புள்ளிக்கு மேல் பெற்றோர் %',
      'சாதாரணதரப் பரீட்சையில் உயர்தரம் கற்கத் தகுதி பெற்றோர் %',
      'உயர்தரப் பரீட்சையில் பல்கலைக்கழக அனுமதிக்குத் தகுதி பெற்றோர் % (கலைத்துறை)',
      'உயர்தரப் பரீட்சையில் பல்கலைக்கழக அனுமதிக்குத் தகுதி பெற்றோர் % (வர்த்தகத்துறை)',
      'உயர்தரப் பரீட்சையில் பல்கலைக்கழக அனுமதிக்குத் தகுதி பெற்றோர் % (உயிரியல் விஞ்ஞானத்துறை)',
      'உயர்தரப் பரீட்சையில் பல்கலைக்கழக அனுமதிக்குத் தகுதி பெற்றோர் % (பௌதிக விஞ்ஞானத்துறை)',
      'உயர்தரப் பரீட்சையில் பல்கலைக்கழக அனுமதிக்குத் தகுதி பெற்றோர் % (தொழில்நுட்பத்துறை)'
    ]],
    ['தவணைப் பரீட்சைப் புள்ளிகளின் முன்னேற்றத்தை அளவிடல்', [
      'தாய்மொழி — 40+ புள்ளி பெற்றோர் சராசரி %',
      'கணிதம் — 40+ புள்ளி பெற்றோர் சராசரி %',
      'விஞ்ஞானம் — 40+ புள்ளி பெற்றோர் சராசரி %',
      'ஆங்கிலம் — 40+ புள்ளி பெற்றோர் சராசரி %',
      'வரலாறு — 40+ புள்ளி பெற்றோர் சராசரி %',
      'சமயம் — 40+ புள்ளி பெற்றோர் சராசரி %',
      'இரண்டாம் மொழி (சிங்களம்/தமிழ்) — 40+ புள்ளி பெற்றோர் சராசரி %',
      'சுகாதாரமும் உடற்கல்வியும் — 40+ புள்ளி பெற்றோர் சராசரி %',
      'செயன்முறை தொழில்நுட்பத் திறன்கள் — 40+ புள்ளி பெற்றோர் சராசரி %',
      'அழகியல் பாடங்கள் (சித்திரம்/நடனம்/சங்கீதம்/நாடகம்/இலக்கிய நயம்) — சராசரி %',
      'முதலாம் தொகுதிப் பாடங்கள் — சராசரி %',
      'மூன்றாம் தொகுதிப் பாடங்கள் — சராசரி %',
      'தரம் 12-13 கலைத்துறை — 40+ புள்ளி பெற்றோர் %',
      'தரம் 12-13 வர்த்தகத்துறை — 40+ புள்ளி பெற்றோர் %',
      'தரம் 12-13 உயிரியல்/பௌதிக விஞ்ஞானம்/தொழில்நுட்பத்துறை — 40+ புள்ளி பெற்றோர் %'
    ]],
    ['பாடசாலை மட்ட கணிப்பீட்டு முன்னேற்றத்தை அளவிடல்', [
      'தரம் 6-9 வகுப்புகளில் பாடசாலைமட்டக் கணிப்பீடு பூரணப்படுத்தப்பட்ட வகுப்புகளின் %',
      'தரம் 10-11 வகுப்புகளில் பாடசாலைமட்டக் கணிப்பீடு பூரணப்படுத்தப்பட்ட வகுப்புகளின் %',
      'தரம் 12-13 வகுப்புகளில் பாடசாலைமட்டக் கணிப்பீடு பூரணப்படுத்தப்பட்ட வகுப்புகளின் %'
    ]],

    ]],
    ['ஆசிரியர் வழிகாட்டி, பாடத்திட்டம், பாடநூல் என்பவற்றை முறையாகப் பங்கீடு செய்தலும் பயனுள்ள முறையில் பாவித்தலும்', [
      'இவை உரிய ஆசிரியருக்கு முற்றாகக் கிடைக்கப்பெற்று பதிவு செய்யப்பட்டு தேவைக்கேற்ப வழங்கும் நடவடிக்கை மேற்கொள்ளப்படல்',
      'பாடசாலையில் இவை பதிந்து வைத்திருத்தல், கௌசியப்படுத்தல், தேவை ஏற்படின் மீள்பெற்றுக்கொள்ளல் நடைமுறை உருவாக்கப்படல்'
    ]],
    ['வகுப்புப் பாடப் பதிவுப் புத்தகம் (Record Book) முறையாகப் பேணப்படுதல்', [
      'சகல வகுப்புகளினதும் வகுப்பறைப் பதிவேடுகளில் அடிப்படைத் தகவல்கள் பூரணப்படுத்தி இற்றைப்படுத்தப்படல்',
      'பாட வேளை முடிவில் தினமும் பாடப்பதிவு ஆசிரியரால் செய்யப்படுகின்றதா என தொடர்ச்சியாகக் கண்காணித்தல்',
      'நாளாந்த/வாராந்த/தவணைக்கான கற்றல் கற்பித்தல் சுருக்க அறிக்கை தயாரித்து பின்னூட்டல் செயற்பாடுகள் நடைமுறைப்படுத்தல்',
      'ஆசிரியர்கள் வராத பாடவேளைகளில் மாற்று வேலைத்திட்டங்கள் வழங்கப்படல் (ஒப்படை வங்கி, வாசிப்புப் பயிற்சி)'
    ]],
    ['மாணவர் தேர்ச்சி விருத்திக்கான செயற்றிட்டங்கள்', [
      'மாணவர் தேர்ச்சி தொடர்பான செயற்றிட்டங்களைத் திட்டமிடலும் நடைமுறைப்படுத்தலும்',
      '6-11 வரையான தரங்களில் உள்ள சகல மாணவர்களும் பங்கேற்கக்கூடிய வகையில் செயற்றிட்டங்கள் ஒழுங்குபடுத்தி கண்காணித்தல்',
      'உயர்தர மாணவர்களுக்கான பல்வகைப்பட்ட செயற்றிட்டங்கள் செயற்படுத்தி, ஆசிரியரூடாக கண்காணித்தல்',
      'செயற்றிட்ட அறிக்கையினை முறையாகப் பேணி ஏனைய மாணவர்கள் பயன்படுத்துவதற்கான சந்தர்ப்பங்கள் வழங்குதல்'
    ]]
  ],
  d4: [
    ['முறையான இணை பாடவிதான செயற்பாடுகள்', [
      'பல்வேறு திறன் விருத்தி, இரசனைகளுக்கும் கலாசாரங்களுக்கும் ஏற்ப செயற்றிட்டங்களை உள்ளடக்கிய வருடாந்த திட்டம் தயாரித்துச் செயற்படுத்தல்',
      'சகல ஆசிரியர்களுக்கும் பொறுப்புகள் கையளிக்கப்பட்டிருத்தலும், பங்குகொள்ளும் மாணவர் தொடர்பில் மேலதிக கவனம் செலுத்துதலும்'
    ]],
    ['ஆரம்பப்பிரிவு இணை பாடவிதான செயற்பாடுகளை வினைத்திறன் மிக்கதாக செயற்படுத்துதல்', [
      'ஆரம்பப் பிரிவுக்குரிய இணைப்பாடவிதான செயற்பாடுகள் தொடர்பான திட்டத்தை தயாரித்தல்',
      'இப்பிரிவுக்குரிய செயற்பாடுகள்/செயற்றிட்டங்களை செயற்படுத்தலும் கண்காணிப்பும்',
      'ஒவ்வொரு முதன்மைநிலைக்குமுரிய உடற்பயிற்சி வேலைத்திட்டங்களை செயற்படுத்தி அதற்காக மாணவர்களை ஈடுபடுத்தல்',
      'முதன்மைநிலை மூன்று தொடர்பாக வெவ்வேறு விருப்பத்துக்குரிய செயற்றிட்டங்களை நடைமுறைப்படுத்தல்'
    ]],
    ['மாணவர்களின் உடல்விருத்திக்குப் பொருத்தமான செயற்பாடுகளுக்குச் சந்தர்ப்பங்கள் வழங்குதல்', [
      'மாணவர்களை விதிமுறைகளுக்கமைவாக ஆற்றல்/விருப்பத்தின் அடிப்படையில் வெவ்வேறு விளையாட்டுக்களில் பங்குபற்ற வாய்ப்புகள் வழங்குதல்',
      'போட்டிகளில் பங்குபற்றும் முன்னர் உடற்தகுதி பரிசோதனை செய்திருத்தல்; உடற்பயிற்சி வேலைத்திட்டங்களைச் செயற்படுத்தல்'
    ]],
    ['மாணவர்களின் ஆற்றல், ஆக்கத்திறன், ஆளுமை விருத்தி என்பவற்றிற்கு நடவடிக்கை எடுத்தல்', [
      'போட்டிகள், அழகியல் வேலைத்திட்டங்கள், கண்காட்சிகள், விவாதம், மொழி வேலைத்திட்டங்கள் நடைமுறைப்படுத்தல்',
      'வெவ்வேறு மன்றங்களை செயற்படுத்தி ஆக்கத்திறனுக்குரிய சந்தர்ப்பங்களுக்கு மாணவர்களை இட்டுச் செல்லுதல்',
      'சாரணியம், சகாதார சேவை, முதலுதவி, சுற்றாடல் படை, செஞ்சிலுவை, சென் ஜோன் அம்புலன்ஸ் படையணி முதலான துணைச்சேவைகள்',
      'ஒவ்வொரு வேலைத்திட்டம் மற்றும் விசேட வெற்றிகள் தொடர்பான கோவைகளை (அறிக்கை, செய்தி, படங்கள், வீடியோ) பேணுதல்'
    ]],
    ['மாணவர்களுக்கு ஒழுக்க, விழுமிய விருத்தியில் அவதானம் செலுத்துதல்', [
      'மாணவர்களின் ஒழுக்கநெறிகள், விழுமியங்கள், கலாசாரங்கள் மற்றும் சமயம் தொடர்பான வேலைத் திட்டங்களைச் செயற்படுத்துதல்',
      'தேசிய ஒருமைப்பாட்டை ஏற்படுத்தும் வகையிலும் தலைமைத்துவப் பண்புகளை விருத்தி செய்யும் வகையிலும் வேலைத் திட்டங்கள் நடத்துதல்'
    ]]
  ],
  d5: [
    ['முறையான மற்றும் திட்டமிடப்பட்ட மாணவர் ஆலோசனை வழிகாட்டல் செயற்பாடுகளை நடைமுறைப்படுத்தல்', [
      'மாணவர் ஆலோசனை வழிகாட்டல் வேலைத்திட்டம் தொடர்பாக பொறுப்புள்ள ஆசிரியருக்குப் பொறுப்புகள் வழங்கி, ஆண்டு நிரல் செயற்படுத்தி பாடசாலைச் சமூகத்துக்கு அறிவுறுத்துதல்',
      'மாணவர் பிரச்சினைகளை இனங்காண்பதற்குத் தெளிவான வழிமுறைகள் எடுத்து, கலந்துரையாடுவதற்கான பொருத்தமான இடம் தெரிவு செய்தல்',
      'வழிகாட்டல் ஆலோசகரிடம் அனுப்பிய பிள்ளையின் பிரச்சினைக்கான தீர்வு பெறப்பட்டுள்ளமை தொடர்பான அறிக்கை பேணப்படல்'
    ]],
    ['பாடசாலைகளில் மாணவர் வரவு', [
      'நேரம் பிந்தி வரும் மாணவர்களை/அடிக்கடி பிந்தி வரும் மாணவர்களை இனம் கண்டு பெற்றோருக்கு அறிவுறுத்தும் வேலைத்திட்டம் நடைமுறைப்படுத்தல்',
      'மாணவர்கள் பாடசாலைக்கு வரும்போதும் திரும்பிச் செல்லும்போதும் எதிர்கொள்ளும் பிரச்சினைகள்/இடையூறுகள் தொடர்பாக நடவடிக்கை எடுத்தல்'
    ]],
    ['முறையான திட்டமிடப்பட்ட தொழில் வழிகாட்டல் செயற்பாடுகளை மேற்கொள்ளல்', [
      'தொழில் பயிற்சிக் கற்கைநெறி நிலையங்கள் தொடர்பான விபரங்கள் சேகரிக்கப்பட்டு இற்றைப்படுத்தப்பட்டு வளவாளர் உதவியுடன் பேணப்படல்',
      'இடைநிலை/பாடசாலை விட்டுச் செல்லும் மாணவர்களின் விருப்பு/திறன்களை இனங்கண்டு பெற்றோர்களுக்கு தொழிற்பயிற்சி நெறிகள் தொடர்பாக அறிவூட்டல்'
    ]],
    ['சமூகப் பொருளாதார பிரச்சினை உள்ள பிள்ளைகளுக்கான உதவித்திட்டங்கள் மேற்கொள்ளல்', [
      'சமூக/பொருளாதார பிரச்சினையை எதிர்நோக்கும் மாணவர்களை இனங்கண்டு, சலுகை வழங்க பாடசாலைமட்ட வேலைத்திட்டம்/செயற்றிட்டம் தயாரித்தல்',
      'உதவி வழங்கக்கூடிய கொடையாளிகளை இனங்கண்டு, அவர்களிடமிருந்து உதவிகளைப் பெற்றுக்கொள்ளல்'
    ]],
    ['மாணவர் சுகாதாரம் மற்றும் போசணை மட்டத்தை இனம் காணல்', [
      'பாடசாலை சுகாதார மேம்பாட்டு வேலைத்திட்டச் செயற்பாடுகள் நடைபெறுதல் (பாடசாலை வைத்திய பரிசோதனைகள், முதலுதவி அலகு)',
      'போசாக்கு வேலைத்திட்டத்தை நடைமுறைப்படுத்துதலும், பிரச்சினைகள் இருப்பின் அறிவுறுத்துதலும்',
      'புகை, போதைப் பாவனையின் தீமைகள் பற்றி அறிவுறுத்தலும் தடுத்தலும் தொடர்பாக வேலைத்திட்டங்கள் ஏற்படுத்துதல்'
    ]],
    ['மாணவர்களின் சுகாதாரத் தேவைகளை உறுதிப்படுத்தல்', [
      'மாணவர்/ஆசிரியர் எண்ணிக்கைக்கு ஏற்ப மலசல கூடங்கள் அமைத்தல்; தினமும் சுத்திகரிப்பு செய்வதற்கான வேலைத்திட்டம்',
      'பாடசாலைக்குள் குப்பை கூழங்களை உரிய முறையில் அகற்றும் வசதிகளும் பயனுள்ள வழியில் பயன்படுத்தும் முறைகளும் காணப்படல்',
      'ஈ, நுளம்பு, தொற்று நோய்கள் பரவுதலைத் தடுக்கும் வழிமுறைகளை எடுத்து இது சம்பந்தமாக அறிவுறுத்தல்'
    ]],
    ['மாணவர் பாதுகாப்பை உறுதிப்படுத்தல்', [
      'சுற்றறிக்கைப்படி சிறுவர் பாதுகாப்புக்கான செயற்றிட்டத்தை நடைமுறைப்படுத்தி, இணைப்பாளராக ஆசிரியர் ஒருவரை நியமித்தல்',
      'சிறுவர் பாதுகாப்பின்மை/துஷ்பிரயோகம் இடம் பெறக்கூடிய சந்தர்ப்பங்கள் தொடர்பாக சமூகத்துக்கு விழிப்புணர்வு ஏற்படுத்துதல்',
      'இரகசிய அறிக்கைகளை முறைப்படி பேணுதலும் தேவைப்படும் சந்தர்ப்பத்தில் உரிய நிறுவனங்களுடன் இணைந்து செயற்படலும்'
    ]],
    ['சிற்றுண்டிச்சாலையை சிறந்த முறையில் பேணுதல்', [
      'சுற்றுநிருபத்திற்கமைய பாடசாலைச் சிற்றுண்டிச்சாலையை நடத்துதல்; அது தொடர்பாக சமூகத்திற்கு அறிவூட்டுதல்',
      'உணவு தயாரிக்கும் இடம், உணவு உண்ணும் இடம் சுத்தமாக பேணுதலும், உணவு வைத்திருக்கும் இடம் தளபாடங்களைச் சுத்தமாக வைத்திருத்தலும்'
    ]],
    ['இடர்முகாமைத்துவச் செயற்பாடுகளை முறையாக மேற்கொள்ளல்', [
      'இடர் முகாமைத்துவக் குழு அமைக்கப்படல்; ஏற்படக்கூடிய இடர்த்தங்களை அறிந்திருத்தலும் தொடர்பு கொள்ள வேண்டிய நிறுவனங்கள் பற்றி அறிந்திருத்தலும்',
      'திடீர் இடர்நேரத்தில் இழப்புகளைக் குறைக்கக்கூடிய உபாயம் பற்றி அறிந்திருத்தலும் அது தொடர்பாக சமூகத்திற்கு அறிவூட்டலும், பாதுகாப்பு ஒத்திகைகள் நடாத்தலும்'
    ]]
  ],
  d6: [
    ['தூரநோக்கு மற்றும் பணிக்கூற்றுக்கு ஏற்ப செயற்படுதல்', [
      'பாடசாலையின் தூரநோக்கு மற்றும் பணிக்கூற்றுக்கு ஏற்ப அங்கீகரிக்கப்பட்ட கல்வி இலக்குகளை அடிப்படையாகக் கொண்டு தனித்தனியாகத் தயாரிக்கப்பட்டு காட்சிப்படுத்தப்படல்',
      'தூரநோக்கும் பணிக்கூற்றும் பாடசாலைச் சமூகத்திற்குத் தெளிவாக அறிவுறுத்தப்பட்டு, அவற்றை அடையும் வகையில் வேலைத்திட்டங்களுக்கு சமூக ஒத்துழைப்பு பெறப்படல்'
    ]],
    ['விளைதிறனான 5 வருட, வருடாந்த அமுலாக்கல் திட்டங்களை தயாரித்தல்', [
      'பாடசாலையின் மதிப்பீடு பகுப்பாய்வு மற்றும் சமூகத்தின் முன்மொழிவுகளை இனங்கண்ட தேவைகள்/நோக்கங்களை அடையும் வகையில் தயாரிக்கப்படல்',
      'கற்றல்-கற்பித்தல் விருத்திக்கு முன்னுரிமை வழங்கும் வகையில் செயற்பாட்டு வேலைத்திட்டங்களும் செயற்றிட்டங்களும் திட்டமிடப்படல்',
      'கல்வித்துறைசார் அபிவிருத்திச் சட்டகத்திற்கு அமைவாக Rolling Plan தயாரிக்கப்பட்டு, செலவு மதிப்பீடுகளும் உள்ளடக்கப்படல்',
      'ஐந்தாண்டுத் திட்டத்திற்கமைவாக முன்னுரிமை அடிப்படையில் வருடாந்த அமுலாக்கல் திட்டம், பாடசாலை நாட்காட்டி தயாரிக்கப்பட்டு மேற்பார்வையும் மீளாய்வும் செய்யப்படல்',
      'வருடாந்த அமுலாக்கல் திட்டத்தின்படி நிர்ணயிக்கப்பட்ட வேலைத்திட்டங்கள் நடைமுறைப்படுத்தப்பட்டு, தேவைக்கேற்ப மாற்றங்கள் ஏற்படுத்தப்படல்'
    ]],
    ['பாடசாலையின் தலைமைத்துவம்', [
      'சகலரிடத்திலும் தலைமைத்துவம் தொடர்பாக சிறந்த தூரநோக்கு காணப்படலும் அனைவராலும் தலைமைத்துவம் ஏற்றுக்கொள்ளப்படலும்',
      'அனைவரும் பொறுப்புடனும் அர்ப்பணிப்புடனும் பாடசாலையின் தரத்தை உயர்த்த முகாமைத்துவத்துக்குப் பங்களிப்புச் செய்தல்'
    ]],
    ['பாடசாலை அபிவிருத்திச் செயற்பாடுகளை வினைத்திறனுடன் செயற்படுத்தல்', [
      'பாடசாலை அபிவிருத்திச் செயற்பாடு பற்றி சமூகத்திற்கு விளக்கமளிப்பதுடன் செயற்பாடுகளில் சமூக ஒத்துழைப்பு கிடைத்தல் (பாடசாலை மேம்பாட்டு வேலைத்திட்டம்)',
      'பாடசாலை அபிவிருத்திக்குத் தேவையான சகல குழுக்களும் அமைக்கப்பட்டு செயற்படுத்தப்படல் (SDC, SMT, TEC, ...)',
      'நியமிக்கப்பட்ட காலப்பகுதிக்குள் செயற்பாடுகள் வினைத்திறனாக நடைபெறுவதுடன் கூட்டங்கள், மீளாய்வுகள் நடாத்தப்பட்டு அறிக்கைகளும் கோவைகளும் பேணப்படல்'
    ]],
    ['நேரசூசியை விளைதிறனுடையதாக செயற்படுத்துதல்', [
      'சுற்று நிருபத்திற்கமைய (நூலகம், கணனி ஆய்வுகூடம், ஏனைய விசேட அலகுகளும் உள்ளடக்கி) ஆசிரிய வளங்களின் உச்சப் பயனைப் பெறும் வகையில் நேர அட்டவணை தயாரிக்கப்பட்டு அமுலாக்கப்படல்',
      'நேர அட்டவணை, பதில் நேர அட்டவணை என்பன செயற்படுவது தொடர்பாக உரியவாறு கண்காணிக்கப்படல்'
    ]],
    ['பாடசாலையின் அன்றாட ஆரம்பம், முடிவு ஏற்றுக் கொள்ளப்பட்ட முறைப்படி இடம்பெறுதல்', [
      'உரிய நேரத்தில் பாடசாலை தொடக்கமும் முடிவும் திட்டமிடப்பட்ட முறையில் இடம்பெறுவதுடன் மத வழிபாட்டு நடவடிக்கைகளில் சகல ஆசிரியர்களும் மாணவர்களும் உரியவாறு பங்குபற்றுதல்',
      'ஆசிரிய-மாணவர் பங்குபற்றலுடன் உடலியக்கச் செயற்பாடுகள் ஒழுங்கான முறையில் நடைபெற்று வருகின்றமை'
    ]],
    ['பாடசாலையின் நிதி முகாமைத்துவத்தை முறையாக மேற்கொள்ளல்', [
      'சுற்று நிருபத்திற்கமைய நிதி நடவடிக்கைகள் இடம் பெறுவதுடன் மேற்பார்வையும் இடம் பெறுதல் (SDC, FF, சம்பளம், ..)',
      'பாடசாலைக் கணக்குகள், நிதிக் கோவைகள் உரிய முறைப்படி பேணப்படுவதுடன் இற்றைப்படுத்தப்பட்டும் இருத்தல்',
      'நிதிப் பாவனை வருடாந்த திட்டத்தின் முன்னுரிமை அடிப்படையில் வழங்கப்படுகிறது; செலவினங்கள் பயனுள்ள வகையில் மேற்கொள்ளப்படல்; மேற்பார்வை செய்யப்படல்',
      'நிதி தொடர்பான நடவடிக்கைகள் வெளிப்படைத் தன்மை கொண்டதாக செயற்படுத்தப்படுதலும் முறையான கண்காணிப்பு நடைபெறுதலும்'
    ]],
    ['முறையான உள்ளக, வெளியக மதிப்பீட்டு செயற்பாடுகள் மூலம் பாடசாலையின் பண்பு சார் நிலையை உயர்த்துதல்', [
      'முறையான உள்ளக மதிப்பீட்டுத் திட்டம் தயாரிக்கப்பட்டு, அதற்கான பொறுப்புகள் பகிர்ந்தளிக்கப்பட்டு உள்ளக மதிப்பீடு முறைப்படி இடம் பெறுதல்',
      'உள்ளக/வெளியக மதிப்பீட்டு அறிக்கையில் காணப்படும் பலம், பலவீனம் தொடர்பில் அவதானம் செலுத்தி பின்னூட்டல் இடம் பெறுதல்',
      'இனங்காணப்பட்ட அபிவிருத்திக்கான தேவைகளும் முன்னுரிமைகளும் வருடாந்த அமுலாக்கல் திட்டத்தில் உள்ளடக்கப்படல்',
      'உள்ளக/வெளியக மதிப்பீட்டு அறிக்கைகள் ஒழுங்காகக் கோவைப்படுத்தப்பட்டிருப்பதுடன் அவற்றின் சிபார்சுகள் நடைமுறைப்படுத்தப்படல்'
    ]],
    ['மாணவர்களின் வரவு இடாப்பினை முறையாகப் பேணுதல்', [
      'மாணவர் சேர்வு இடாப்பு இற்றைப்படுத்தப்பட்டு மாணவர் தினவரவு முறைப்படியும் தூய்மையாகவும் இடாப்பில் பதிவு செய்யப்படல்',
      'மாணவர் சேர்வு இடாப்பு நாளாந்த/மாதாந்த/வருடாந்த வரவுப் பதிவுகள் சாராம்சம் செய்யப்பட்டு, பகுப்பாய்வின்மூலம் வரவுப் பிரச்சினையான மாணவர்கள் இனங்காணப்பட்டு செயற்றிட்டம் தயாரிக்கப்படல்'
    ]],
    ['கல்வி சார், கல்வி சாரா அலுவலர்களுடைய வரவு மற்றும் பதிவுகளைப் பேணுதல்', [
      'கல்விசார், கல்விசாரா ஊழியர்களின் வரவு ஒப்பப்பதிவேடு உரிய நேரத்தில் மூடப்பட்டு வரவின்மை பதியப்பட்டு மேற்பார்வை செய்யப்படல்',
      'அனுமதியுடன் லீவு பெறுகின்ற நடைமுறை உரியவாறு பேணப்படுவதுடன் பதில் கடமை ஒழுங்குகள் மேற்கொள்ளப்படல்; சம்பளமற்ற லீவுகள் அறிக்கைப்படுத்தப்படல்',
      'வரவு சாராம்சம் செய்யப்பட்டு பிரச்சினைகள் அடையாளம் காணப்பட்டு பரிகார நடவடிக்கைகள் எடுக்கப்படல்; சம்பள ஏற்ற நடவடிக்கைகளுக்குப் பயன்படுத்தப்படல்',
      'பிந்திய வருகை, நாளாந்த லீவு, குறுகிய லீவு பதிவேடுகளிலும் கோவைகளிலும் பேணப்படுவதுடன் தினமும் இற்றைப்படுத்தப்படல்'
    ]],
    ['மனித வளங்களின் தேவையை நிறைவேற்றுதல், மற்றும் முறையான மேற்பார்வை மேற்கொள்ளுதல்', [
      'சுற்று நிருபத்தின்படி கல்வி சார் ஆளணியின் தேவைப்பாடு/பற்றாக்குறை/மேலதிகம் என்பன கணிப்பிடப்பட்டு உரிய பிரிவுக்குத் தகவல் வழங்கப்படல்',
      'சுற்று நிருபத்தின்படி கல்வி சார், கல்வி சாரா ஆளணியினரின் கடமைப்பொறுப்புகள் எழுத்து மூலம் வழங்கப்பட்டு, முறையாக மேற்பார்வை செய்யப்படல்'
    ]],
    ['ஊழியர்களின் தொழில் வாண்மை விருத்திக்கு நடவடிக்கை எடுத்தல்', [
      'கல்வி சார்/சாரா ஊழியர்களின் தொழில் வாண்மை விருத்தித் தேவைப்பாடுகள் இனங்காணப்பட்டு திட்டம் தயாரிக்கப்பட்டு, வளவாளர் குழு பட்டியல் பாடசாலையில் பேணப்படல்',
      'சகலரின் பங்குபற்றலுடன் தரவட்டம், பாடசாலை மட்ட ஆசிரியர் அபிவிருத்தித் திட்டம் (SBTD), வாண்மை விருத்தி தொடர்பான திட்டங்கள் தயாரிக்கப்பட்டிருத்தல்',
      'கல்வி சார்/சாரா ஆளணியினருக்கு வழங்கப்படும் பல்வேறு வெளியக தொழில் வாண்மைவிருத்தி வேலைத்திட்டங்களில் பங்குபற்ற சந்தர்ப்பம் வழங்கப்பட்டு, பெறப்பட்ட வாண்மை ஏனையோருக்கும் பகிரப்படல்'
    ]],
    ['விளைதிறனான கல்வி, முகாமைத்துவ தகவல் முறையினைப் பேணுதல் (EMIS)', [
      'மாணவர், ஆசிரியர், பௌதிக வளங்கள் தொடர்பான தகவல்கள் முறைப்படி பேணப்படல்',
      'அடைவு மட்டப்பகுப்பாய்வு தகவல் (பரீட்சை/செயற்றிட்டம்/மதிப்பீடு/மாணவர் புள்ளிப்பதிவேடு) பேணப்படல்',
      'தகவல்களை இலகுவாகவும் விரைவாகவும் வழங்கவும் பெறவும் ஏற்றவகையிலும் இற்றைப்படுத்தி தீர்மானம் எடுத்தலுக்கு ஏற்ற வகையில் தகவல்தளம் ஒழுங்கமைக்கப்பட்டிருத்தல்'
    ]],
    ['பாடசாலையினுள் உயர் ஒழுக்கத்தைப் பேணுதல்', [
      'ஒழுங்காற்றுக்குழு அமைக்கப்பட்டு கூட்டம் நடத்தப்பட்டிருத்தல்; எழக்கூடிய ஒழுக்காற்றுப் பிரச்சினைகள் இனங்காணப்பட்டு தீர்ப்பதற்கான வழிமுறைகள் கண்டறியப்பட்டு விடயங்கள் ஆவணப்படுத்தப்படல்',
      'ஆசிரியர்கள், மாணவர்கள் மற்றும் கல்விசாரா ஊழியர்கள் தொடர்பாக அனைவரும் ஏற்றுக் கொள்ளக்கூடிய ஒழுக்கநெறிக்கோவை தயாரிக்கப்பட்டு, சகலருக்கும் அறிவுறுத்தப்பட்டு தேவைக்கேற்ப இற்றைப்படுத்தப்படல்'
    ]],
    ['ஊழியர்களின் செயலாற்றுகைத் தரங் கணிப்பீட்டினை மேற்கொள்ளல்', [
      'கல்விசார், கல்விசாரா சகல ஆளணியினதும் செயலாற்றுகை மதிப்பீடு செய்யப்பட்டு அறிக்கையாக்கப்பட்டு சுயவிபரக் கோவையில் இடம்பெறுதல்',
      'பாடசாலை ஆளணியினரின் இனங்காணப்பட்ட அபிவிருத்தித் தேவைகளைப் பூர்த்தி செய்யவும் விசேட திறன்களை மதிப்பிடுவதற்குமான வேலைத்திட்டம் நடைமுறைப்படுத்தப்படல்'
    ]],
    ['கோவைகள் மற்றும் ஆவணங்களை முறையாகப் பேணுதல்', [
      'சகல கோவைகளும் பதிவேடுகளும் அலுவலக நடைமுறைகளுக்கேற்ப முறைமையாகத் தயாரிக்கப்பட்டு, இலகுவில் அடையாளம் காணும் வகையில் ஒழுங்கமைக்கப்பட்டு பட்டியலிடப்பட்டிருத்தல்',
      'அவசியமான பழைய கோவைகள் அவதானத்துடன் பேணப்பாதுகாக்கப்படுகின்றமை; தேவையற்றவை முறையாக நீக்கப்படுகின்றன',
      'தினசரி கிடைக்கப்பெறும் கடிதங்கள் தொடர்பாக மேற்கொள்ளப்பட்ட நடவடிக்கைகள் அறிக்கையிடப்பட்டுள்ளன'
    ]]
  ],
  d7: [
    ['பாடசாலைக் காணி, மற்றும் வரைபடம் முறையாகப் பேணப்படல்', [
      'பாடசாலைக் காணியின் இற்றைப்படுத்தப்பட்ட வரைபடம் தெளிவாகக் காட்சிப்படுத்தப்பட்டிருத்தலும், கட்டிடங்கள் யாவும் தெளிவாக இலக்கமிடப்பட்டு பெயரிடப்பட்டு திசைகளும் காட்டப்பட்டிருத்தல்',
      'பாடசாலைவளாகம் சுத்தமாகவும் பாதுகாப்பாகவும் பேணப்படுவதற்கான வேலைத்திட்டம் நடைமுறையிருத்தல்; காணி வேளாண்மை/அலங்காரத் தாவரங்களை வளர்க்கவும் பயன்படுத்தப்படல்',
      'பாடசாலை வளாகம் ஆக்கபூர்வமான கற்றல் சூழலைக் கொண்டுள்ளது'
    ]],
    ['கட்டிடங்கள், அடிப்படை வசதிகளைப் பொருத்தமான முறையில் பயன்படுத்தல்', [
      'பாடசாலையில் உள்ள வளங்களின் உச்சப் பயன்பாட்டினைப் பெறுவதற்காக பாடசாலையின் வெவ்வேறு பிரிவுகளின் தேவைகளுக்கும் ஏற்ப பொருத்தமான இடங்கள் ஒதுக்கப்படல்',
      'வகுப்பறைகள் சுத்தமாகவும் கவர்ச்சியாகவும் பேணப்பட்டு, மாணவர்களின் ஆக்கங்களைக் கொண்ட கற்றல் சூழல் பேணப்படல்',
      'நீர் மற்றும் மின்சாரம் என்பன சிக்கனமாகவும் பாதுகாப்பாகவும் பாவிப்பதற்கு ஏற்பாடுகள் செய்யப்பட்டுள்ளமை',
      'அலுவலகப் பௌதிக சூழல் முறையாகப் பேணப்படல்'
    ]],
    ['தளபாடங்கள், கற்றல் உபகரணங்களை வினைத்திறனுள்ளதாக பயன்படுத்துதலும் பேணுதலும்', [
      'உடைந்த தளபாடங்கள், பழுதடைந்த தளபாடங்களை களஞ்சியப்படுத்தி வைத்து, திருத்துவதற்கான பொறிமுறை ஒன்றை ஏற்படுத்துதல்; பயன்படுத்த முடியாதவற்றை அகற்றுவதற்கான நடைமுறை இருத்தல்',
      'ஆரம்ப, இடைநிலை வகுப்பறைகளில் செயற்பாட்டு மேசை, புத்தக மூலை, கற்றல் உபகரணங்கள் என்பனவற்றைப் பராமரிப்பதற்கும் திருத்துவதற்கும் நடவடிக்கை எடுக்கப்படல்'
    ]],
    ['பொருட்பதிவுப் புத்தகம், பொருள் இருப்புப் புத்தகத்தை முறையாகப் பேணல்', [
      'அலுவலகத்தில் பிரதான பொருட்பதிவேட்டுப் புத்தகமும் உபபொருட்பதிவேட்டுப் புத்தகமும் இற்றைப்படுத்தி பேணப்படுகின்றமை',
      'பொருள் கணக்கெடுப்பு செய்வதற்காக உரிய காலத்தில் வலயக் கல்வி அலுவலகத்திற்கு அறிவிக்கப்பட்டுள்ளது; பொருள் கணக்கெடுப்பின்போது விதந்துரைக்கப்பட்ட விடயங்கள் நடைமுறைப்படுத்தப்படல்'
    ]],
    ['ஆய்வுகூட வசதியைச் செய்து கொடுத்தல், வினைத்திறனுடன் பாவித்தல், பேணுதல்', [
      'ஆய்வுகூடம் சுத்தமாகவும், கவர்ச்சியாகவும் அமைந்துள்ளதுடன் அவ்விடம் வினைத்திறனுடன் பயன்படுத்தப்படல்',
      'அனைத்து இரசாயனப் பொருட்களும் உபகரணங்களும் பெயரிடப்பட்டு பாதுகாப்பாகக் கையாளப்படல்',
      'பொருத்தமான அனைத்து வகுப்புகளுக்கும் விஞ்ஞான ஆய்வுகூட பயன்பாடு தொடர்பான நேர அட்டவணை பேணப்பட்டு, விஞ்ஞான ஆய்வுகூடப் பாவனைக்கான பதிவேடு பேணப்படல்'
    ]],
    ['நூலகத்தை வினைத்திறனுடன் பாவித்தலும் அபிவிருத்தி அடையச் செய்தலும்', [
      'நூல்கள், சஞ்சிகைகள், பத்திரிகைகள் என்பன பட்டியலிடப்பட்டு, வகைப்படுத்தப்பட்டு வைக்கப்பட்டுள்ளமை',
      'அனைத்து வகுப்புகளுக்கும் நூலக பயன்பாடு தொடர்பான நேர அட்டவணை பேணப்பட்டு, பாவனைக்கான பதிவேடும் பேணப்படல்',
      'பாடசாலை நூலகத்தை கற்றல் வள நிலையமாக அபிவிருத்திசெய்து நல்ல பயனுள்ள வகையில் பயன்படுத்துதல் (உதா: வகுப்பறை நூலகம், புத்தகப் பை, பிறந்தநாள் பரிசு, புத்தக மூலை)',
      'நூல்களை வழங்குதல், பெறுதல், பாவித்தல், பாதுகாத்தல் தொடர்பான முறையான வேலைத்திட்டம் உள்ளது'
    ]],
    ['கணனி வசதிகளை பயனுள்ளதாக பயன்படுத்தலும், பேணுதலும்', [
      'கணனி அறை கற்றல் சூழலுடன் சுத்தமாக பராமரிக்கப்படுகின்றது; கணனி வன்பொருள், மென்பொருள்கள் உரிய முறையில் பராமரிக்கப்படல்',

  var dData = state.deptData[deptId];

      c.indicators.forEach(function(ind){
        total++;
        if(ind.score && ind.score>0){ scored++; sum+=ind.score; }

  }
  var percent = scored>0 ? Math.round((sum/(scored*6))*100) : null;
  var grade = percent!=null ? gradeInfo(percent) : null;

}

  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read failed')); };
    reader.onload = function(e){
      var img = new Image();
      img.onerror = function(){ reject(new Error('image failed')); };
      img.onload = function(){
        var w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; }
          else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        var canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- Firestore data layer ---------------- */

function saveTimers(){ return saveTimers._t || (saveTimers._t = {}); }
function scheduleSaveDept(deptId){
  var size = deptDocSizeChars(deptId);
  if(size > MAX_DEPT_DOC_CHARS){
    setSaveStatus('சேமிக்கப்படவில்லை — இந்தத் துறையின் தரவு மிகப் பெரியது (படங்கள் அதிகம்). ஒரு சில படங்களை நீக்கிப் பிறகு முயற்சிக்கவும்.');
    return;
  }
  setSaveStatus('சேமிக்கிறது…');
  clearTimeout(saveTimers()[deptId]);
  saveTimers()[deptId] = setTimeout(function(){
    db.collection('departments').doc(deptId).set(state.deptData[deptId]).then(function(){
      setSaveStatus('சேமிக்கப்பட்டது ✓');
    }).catch(function(err){
      var msg = err && err.message ? err.message : '';
      if(/longer than|exceeds|too large/i.test(msg)){
        setSaveStatus('சேமிக்கப்படவில்லை — தரவு Firestore இன் அளவு வரம்பைத் தாண்டியுள்ளது. படங்களைக் குறைக்கவும்.');
      } else {
        setSaveStatus('சேமிப்பில் சிக்கல்: '+msg);
      }
    });
  }, 700);
}
function setSaveStatus(text){
  var el=document.getElementById('saveStatus');
  if(el) el.textContent=text;
}

function subscribeDept(deptId, onChange){
  if(state.deptUnsub[deptId]) return;
  state.deptUnsub[deptId] = db.collection('departments').doc(deptId).onSnapshot(function(snap){
    delete state.deptErrors[deptId];
    if(snap.metadata.hasPendingWrites) return; // our own optimistic write echoing back
    if(snap.exists){
      state.deptData[deptId] = migrateDeptData(snap.data());
    } else {
      state.deptData[deptId] = buildEmptyDeptData(deptId);
      db.collection('departments').doc(deptId).set(state.deptData[deptId]).catch(function(){});
    }
    if(onChange) onChange();
  }, function(err){
    console.error('dept snapshot error', deptId, err);
    state.deptErrors[deptId] = (err && err.code) ? err.code : (err && err.message) || 'unknown error';
    if(onChange) onChange();
  });
}
function unsubscribeDept(deptId){
  if(state.deptUnsub[deptId]){ state.deptUnsub[deptId](); delete state.deptUnsub[deptId]; }
}
function unsubscribeAllDepts(){
  Object.keys(state.deptUnsub).forEach(unsubscribeDept);
}

function subscribeSchoolMeta(onChange){
  if(state.schoolUnsub) return;
  state.schoolUnsub = db.collection('config').doc('school').onSnapshot(function(snap){
    if(snap.exists){ state.school = snap.data(); }
    if(onChange) onChange();
  });
}

function getSecondaryApp(){

    try{ secondaryApp = firebase.app('Secondary'); }
    catch(e){ secondaryApp = firebase.initializeApp(firebaseConfig, 'Secondary'); }
  }
  return secondaryApp;
}

function fetchRole(uid){
  return db.collection('users').doc(uid).get().then(function(doc){
    return doc.exists ? doc.data().role : null;
  });
}

function routeAfterAuth(){
  if(!state.user){ state.view='login'; renderApp(); return; }
  fetchRole(state.user.uid).then(function(role){
    state.role = role;
    if(!role){ state.view='noRole'; renderApp(); return; }
    subscribeSchoolMeta(function(){ if(state.view==='admin') renderApp(); });
    if(role==='admin'){ state.view='admin'; renderApp(); }
    else if(deptById(role)){ state.currentDept=role; state.view='dept'; subscribeDept(role, function(){ if(state.view==='dept'&&!isTypingInApp()) renderApp(); }); renderApp(); }
    else { state.view='noRole'; renderApp(); }
  });
}

function friendlyAuthError(err){
  var code = err && err.code || '';
  if(code==='auth/invalid-email') return 'மின்னஞ்சல் வடிவம் தவறானது.';
  if(code==='auth/user-not-found' || code==='auth/wrong-password' || code==='auth/invalid-credential') return 'மின்னஞ்சல் அல்லது கடவுச்சொல் பொருந்தவில்லை.';
  if(code==='auth/too-many-requests') return 'பல தடவைகள் தவறாக முயற்சிக்கப்பட்டது. சிறிது நேரம் கழித்து முயற்சிக்கவும்.';
  if(code==='auth/email-already-in-use') return 'இந்த மின்னஞ்சல் ஏற்கெனவே பயன்பாட்டில் உள்ளது.';
  if(code==='auth/weak-password') return 'கடவுச்சொல் மிகவும் எளிமையானது (6 எழுத்துகளுக்கு மேல் தேவை).';
  return (err && err.message) ? err.message : 'ஏதோ தவறு நேர்ந்தது.';
}

    var printBtn = critEl.querySelector('[data-role="printcrit"]');

        renderDeptView(app, deptId, opts);
      }

    critEl.querySelector('[data-role="addind"]').onclick=function(){

      scheduleSaveDept(deptId);
      renderDeptView(app, deptId, opts);
    };

    critEl.querySelectorAll('.ind-row').forEach(function(rowEl){
      var indId = rowEl.getAttribute('data-ind');
      var ind = null;
      for(var j=0;j<c.indicators.length;j++){ if(c.indicators[j].id===indId){ ind=c.indicators[j]; break; } }
      if(!ind) return;
      if(!ind.entries) ind.entries = [];

      rowEl.querySelector('[data-role="title"]').oninput=function(e){ ind.title=e.target.value; scheduleSaveDept(deptId); };
      rowEl.querySelector('[data-role="score"]').onchange=function(e){
        ind.score=parseInt(e.target.value,10)||0;
        scheduleSaveDept(deptId);
        renderDeptView(app, deptId, opts);
      };
      rowEl.querySelector('[data-role="delind"]').onclick=function(){
        if(confirm('இந்தச் சுட்டியையும் அதன் கீழுள்ள அனைத்துப் பதிவுகளையும் நீக்கவா?')){
          c.indicators = c.indicators.filter(function(x){ return x.id!==ind.id; });
          scheduleSaveDept(deptId);
          renderDeptView(app, deptId, opts);
        }
      };
      rowEl.querySelector('[data-role="addentry"]').onclick=function(){
        ind.entries.push({id:uid(), date:todayStr(), note:'', imageData:null, imageName:null});
        scheduleSaveDept(deptId);
        renderDeptView(app, deptId, opts);
      };

      rowEl.querySelectorAll('.entry-row').forEach(function(entryEl){
        var entryId = entryEl.getAttribute('data-entry');
        var entry = null;
        for(var k=0;k<ind.entries.length;k++){ if(ind.entries[k].id===entryId){ entry=ind.entries[k]; break; } }
        if(!entry) return;

        entryEl.querySelector('[data-role="edate"]').onchange=function(e){ entry.date=e.target.value; scheduleSaveDept(deptId); };
        entryEl.querySelector('[data-role="enote"]').oninput=function(e){ entry.note=e.target.value; scheduleSaveDept(deptId); };
        entryEl.querySelector('[data-role="delentry"]').onclick=function(){
          if(confirm('இந்தப் பதிவை (திகதி, படம், குறிப்பு) நீக்கவா?')){
            ind.entries = ind.entries.filter(function(x){ return x.id!==entry.id; });
            scheduleSaveDept(deptId);
            renderDeptView(app, deptId, opts);
          }
        };
        var efile = entryEl.querySelector('[data-role="efile"]');
        efile.onchange=function(e){
          var f = e.target.files && e.target.files[0];
          if(!f) return;
          if(!/^image\//.test(f.type)){ alert('படக்கோப்பை மட்டும் தெரிவு செய்யவும் (jpg, png).'); return; }
          setSaveStatus('படம் தயார் செய்யப்படுகிறது…');
          fileToCompressedDataUrl(f).then(function(dataUrl){
            entry.imageData=dataUrl; entry.imageName=f.name;
            scheduleSaveDept(deptId);
            renderDeptView(app, deptId, opts);
          }).catch(function(err){ alert('படத்தைச் சேர்க்க முடியவில்லை: '+(err&&err.message?err.message:'')); setSaveStatus(''); });
        };
        var eRemoveBtn = entryEl.querySelector('[data-role="eremoveimg"]');
        if(eRemoveBtn){
          eRemoveBtn.onclick=function(){
            entry.imageData=null; entry.imageName=null;
            scheduleSaveDept(deptId);
            renderDeptView(app, deptId, opts);
          };
        }
      });
    });
  });
}

function fileToLogoDataUrl(file, maxDim){
  maxDim = maxDim || 220;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read failed')); };
    reader.onload = function(e){
      var img = new Image();
      img.onerror = function(){ reject(new Error('image failed')); };
      img.onload = function(){
        var w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; }
          else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        var canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

      '<div class="field"><label>பங்கு</label><select id="newRole" class="role-select">'+
        DEPARTMENTS.map(function(d){ return '<option value="'+d.id+'">'+escapeHtml(d.name)+'</option>'; }).join('')+
        '<option value="admin">அதிபர் / முகாமைத்துவம்</option>'+
      '</select></div>'+
      '<button class="btn-primary" id="btnCreateUser">கணக்கை உருவாக்கு</button>'+
    '</div>'+
    '<div class="error-msg" id="setupErr"></div>'+
    '<table class="setup-table"><thead><tr><th>மின்னஞ்சல்</th><th>பங்கு</th><th></th></tr></thead>'+
    '<tbody id="usersTbody"><tr><td colspan="3" style="color:var(--ink-soft)">ஏற்றப்படுகிறது…</td></tr></tbody></table>'+
    '<footer class="app-footer">புதிதாக உருவாக்கிய மின்னஞ்சல் மற்றும் தற்காலிகக் கடவுச்சொல்லை அந்தந்தத் துறைப் பொறுப்பாளரிடம் நேரடியாக வழங்கவும்.</footer>';

  document.getElementById('btnBackAdmin').onclick=function(){ state.view='admin'; renderApp(); };

  function saveSchoolMeta(){
    db.collection('config').doc('school').set(school).then(function(){
      setSaveStatus('சேமிக்கப்பட்டது ✓');
    }).catch(function(err){ setSaveStatus('சேமிப்பில் சிக்கல்: '+err.message); });
    var t=document.querySelector('.brand-title'); if(t) t.textContent=school.name||'';
  }
  document.getElementById('schoolName').oninput=function(e){ school.name=e.target.value; saveSchoolMeta(); };
  document.getElementById('schoolYear').oninput=function(e){ school.year=e.target.value; saveSchoolMeta(); };
  document.getElementById('logoFile').onchange=function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    if(!/^image\//.test(f.type)){ alert('படக்கோப்பை மட்டும் தெரிவு செய்யவும்.'); return; }
    fileToLogoDataUrl(f).then(function(dataUrl){
      school.logoData = dataUrl;
      saveSchoolMeta();
      renderSchoolSetup(app);
    }).catch(function(){ alert('சின்னத்தைச் சேர்க்க முடியவில்லை.'); });
  };
  var rmBtn = document.getElementById('btnRemoveLogo');
  if(rmBtn){
    rmBtn.onclick=function(){
      school.logoData = null;
      saveSchoolMeta();
      renderSchoolSetup(app);
    };
  }

  function loadUsers(){
    db.collection('users').get().then(function(snap){
      var rows = [];
      snap.forEach(function(doc){ rows.push({uid:doc.id, email:doc.data().email, role:doc.data().role}); });
      state.usersCache = rows;
      renderUsersTable();
    }).catch(function(err){
      document.getElementById('usersTbody').innerHTML = '<tr><td colspan="3" style="color:var(--rust)">'+escapeHtml(err.message)+'</td></tr>';
    });
  }

  function renderUsersTable(){
    var tbody = document.getElementById('usersTbody');
    if(!state.usersCache.length){
      tbody.innerHTML = '<tr><td colspan="3" style="color:var(--ink-soft)">இதுவரை பயனர்கள் யாரும் இல்லை.</td></tr>';
      return;
    }
    tbody.innerHTML = state.usersCache.map(function(u){
      var opts = DEPARTMENTS.map(function(d){ return '<option value="'+d.id+'"'+(u.role===d.id?' selected':'')+'>'+escapeHtml(d.name)+'</option>'; }).join('') +
        '<option value="admin"'+(u.role==='admin'?' selected':'')+'>அதிபர் / முகாமைத்துவம்</option>';
      return '<tr data-uid="'+u.uid+'">'+
        '<td>'+escapeHtml(u.email)+'</td>'+
        '<td><select class="role-select" data-role-for="'+u.uid+'">'+opts+'</select></td>'+
        '<td style="white-space:nowrap">'+
          '<button class="btn-tiny" data-act="reset" data-email="'+escapeHtml(u.email)+'">கடவுச்சொல் மீட்பு அனுப்பு</button> '+
          '<button class="btn-tiny" data-act="remove" data-uid="'+u.uid+'">அணுகலை நீக்கு</button>'+
        '</td>'+
      '</tr>';
    }).join('');

    tbody.querySelectorAll('[data-role-for]').forEach(function(sel){
      sel.onchange=function(){
        var targetUid = sel.getAttribute('data-role-for');
        db.collection('users').doc(targetUid).update({role:sel.value}).then(function(){
          var u = state.usersCache.find(function(x){ return x.uid===targetUid; });
          if(u) u.role = sel.value;
        }).catch(function(err){ alert('பங்கை மாற்ற முடியவில்லை: '+err.message); });
      };
    });
    tbody.querySelectorAll('[data-act="reset"]').forEach(function(btn){
      btn.onclick=function(){
        auth.sendPasswordResetEmail(btn.getAttribute('data-email')).then(function(){
          alert('கடவுச்சொல் மீட்பு இணைப்பு அனுப்பப்பட்டது.');
        }).catch(function(err){ alert(err.message); });
      };
    });
    tbody.querySelectorAll('[data-act="remove"]').forEach(function(btn){
      btn.onclick=function(){
        var targetUid = btn.getAttribute('data-uid');
        if(!confirm('இந்தப் பயனரின் அணுகல் பங்கை நீக்கவா? (இது Firebase Authentication இலிருந்து கணக்கையே நீக்காது — தேவைப்பட்டால் அதை Firebase console இல் தனியாக நீக்க வேண்டும்.)')) return;
        db.collection('users').doc(targetUid).delete().then(loadUsers).catch(function(err){ alert(err.message); });
      };
    });
  }

  document.getElementById('btnCreateUser').onclick=function(){
    var email = document.getElementById('newEmail').value.trim();
    var pass = document.getElementById('newPass').value;
    var role = document.getElementById('newRole').value;
    var errEl = document.getElementById('setupErr');
    errEl.textContent='';
    if(!email || !pass){ errEl.textContent='மின்னஞ்சலும் கடவுச்சொல்லும் இட்டு நிரப்பவும்.'; return; }
    if(pass.length<6){ errEl.textContent='கடவுச்சொல் 6 எழுத்துகளுக்கு மேல் இருக்க வேண்டும்.'; return; }
    var sec = getSecondaryApp();
    var secAuth = sec.auth();
    secAuth.createUserWithEmailAndPassword(email, pass).then(function(cred){
      var newUid = cred.user.uid;
      return db.collection('users').doc(newUid).set({email:email, role:role}).then(function(){
        return secAuth.signOut();
      });
    }).then(function(){
      document.getElementById('newEmail').value='';
      document.getElementById('newPass').value='';
      loadUsers();
    }).catch(function(err){ errEl.textContent = friendlyAuthError(err); });
  };

  loadUsers();
}

/* ---------------- boot ---------------- */

function renderFatalError(message){
  var app = document.getElementById('app');
  app.innerHTML = '<div class="center-wrap"><div class="login-card" style="max-width:600px;text-align:left">'+
    '<h1 style="text-align:center">ஏதோ தவறு நேர்ந்தது</h1>'+
    '<p>இந்தப் பிழைச் செய்தியை Claude இடம் காட்டினால், உடனே சரிசெய்ய உதவும்:</p>'+
    '<p style="background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-word">'+escapeHtml(message)+'</p>'+
    '</div></div>';
}

function boot(){
  if(CONFIG_IS_PLACEHOLDER){ renderApp(); return; }
  if(typeof firebase === 'undefined'){
    renderFatalError('firebase எனும் பெயர் கிடைக்கவில்லை. இணைய இணைப்பு உள்ளதா எனச் சரிபார்த்து, index.html ஐ ஒரு பிரவுசரில் (இணையம் இணைக்கப்பட்ட நிலையில்) மீண்டும் திறக்கவும்.');
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
  }catch(e){
    renderFatalError('Firebase தொடங்க முடியவில்லை — firebaseConfig இல் தவறு இருக்கலாம்:\n\n'+(e && e.message ? e.message : e));
    return;
  }

  auth.onAuthStateChanged(function(user){
    state.user = user;
    unsubscribeAllDepts();
    state.deptErrors = {};
    if(state.schoolUnsub){ state.schoolUnsub(); state.schoolUnsub=null; }
    routeAfterAuth();
  }, function(err){
    renderFatalError('உள்நுழைவு நிலையைச் சரிபார்க்க முடியவில்லை:\n\n'+(err && err.message ? err.message : err));
  });

  renderApp();
}

try{
  boot();
}catch(e){
  console.error(e);
  renderFatalError((e && e.stack) ? e.stack : String(e));
}

window.addEventListener('error', function(ev){
  if(state.view==='boot' || !document.getElementById('app').innerHTML.trim()){
    renderFatalError((ev.error && ev.error.stack) ? ev.error.stack : ev.message);
  }
});

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  state.deferredInstallPrompt = e;
  state.canInstall = true;
  if(state.view==='login') renderApp();
});
window.addEventListener('appinstalled', function(){
  state.canInstall = false;
  state.deferredInstallPrompt = null;
});
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* fine if this fails, e.g. opened via file:// */ });
  });
}

})();

</script>
</body>
</html>
